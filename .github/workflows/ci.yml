name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        os: [windows-latest]
        include:
          - os: ubuntu-24.04
            python: '3.12'
          - os: ubuntu-24.04-arm
            python: '3.12'
          - os: macos-15-intel
            python: '3.12'
          - os: macos-15
            python: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated test dependencies
        run: |
          python -m pip install --upgrade 'pip>=26.2,<27'
          python -m pip install -e '.[test]' build twine
      - name: Test without a viewer
        run: python -m pytest -q
      - name: Check tool reference generation
        run: |
          python scripts/generate_catalog.py
          git diff --exit-code -- docs/TOOLS.md docs/tool-catalog.json
      - name: Build and validate distributions
        if: matrix.python == '3.12'
        run: |
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz
          python scripts/build_release.py
          python scripts/build_skill.py
      - name: Test installed wheel in a fresh environment
        if: matrix.python == '3.12'
        run: python scripts/verify_wheel.py dist/*.whl
      - name: Test the downloaded-source setup procedure
        if: matrix.python == '3.12'
        run: python scripts/verify_source.py dist/*-source.zip
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: matrix.python == '3.12'
        with:
          node-version: '24'
      - name: Check with the pinned official MCP Inspector
        if: matrix.python == '3.12'
        run: python scripts/verify_inspector.py
      - name: Check installed dependencies against published advisories
        if: matrix.python == '3.12'
        run: |
          python -m pip install pip-audit
          python -m pip_audit --skip-editable
